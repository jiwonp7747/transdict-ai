name: Release Charts

on:
  push:
    branches:
      - prod
    paths:
      - 'charts/**' # chart modifications only

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for writing index.yaml on gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: 'helm/'

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser # helm package and index
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: helm/charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"